version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: saarthi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: saarthi_user
      POSTGRES_PASSWORD: saarthi_password
      POSTGRES_DB: saarthi_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U saarthi_user -d saarthi_db']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: saarthi-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: saarthi-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: saarthi_mongo
      MONGO_INITDB_ROOT_PASSWORD: saarthi_mongo_password
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

volumes:
  postgres_data:
  redis_data:
  mongo_data:
